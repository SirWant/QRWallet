<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#111419"/><stop offset="1" stop-color="#050607"/></linearGradient>
  <radialGradient id="bandglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF5F1F" stop-opacity=".25"/><stop offset="1" stop-color="#FF5F1F" stop-opacity="0"/></radialGradient>
  <radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B62B32" stop-opacity=".32"/><stop offset="1" stop-color="#B62B32" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="356" rx="18" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1" opacity="1"/>
<rect x="3" y="3" width="1194" height="354" fill="url(#grid)"/>

<!-- Background Glows -->
<ellipse cx="980" cy="140" rx="240" ry="160" fill="url(#redglow)" filter="url(#blur)"/>
<ellipse cx="880" cy="180" rx="180" ry="120" fill="url(#bandglow)" filter="url(#blur)"/>

<!-- Decorative Watch Capsule Wireframe -->
<g transform="translate(900, 40)">
  <!-- Outer Band frame -->
  <rect x="0" y="0" width="130" height="280" rx="65" fill="#121519" stroke="#3A3E45" stroke-width="2"/>
  <!-- Bezel -->
  <rect x="6" y="6" width="118" height="268" rx="59" fill="#050708" stroke="#1F2328" stroke-width="1.5"/>
  <!-- Screen Area -->
  <rect x="14" y="24" width="102" height="232" rx="51" fill="#000000" stroke="#B62B32" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Screen QR Representation -->
  <rect x="33" y="55" width="64" height="64" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="41" y="63" width="18" height="18" fill="#FFFFFF"/>
  <rect x="44" y="66" width="12" height="12" fill="#000000"/>
  <rect x="71" y="63" width="18" height="18" fill="#FFFFFF"/>
  <rect x="74" y="66" width="12" height="12" fill="#000000"/>
  <rect x="41" y="93" width="18" height="18" fill="#FFFFFF"/>
  <rect x="44" y="96" width="12" height="12" fill="#000000"/>
  <rect x="63" y="85" width="6" height="6" fill="#FFFFFF"/>
  <rect x="75" y="95" width="8" height="8" fill="#FFFFFF"/>
  <rect x="85" y="85" width="6" height="6" fill="#FFFFFF"/>
  <text x="65" y="145" font-family="JetBrains Mono, monospace" font-size="9px" font-weight="600" fill="#E9E5DC" text-anchor="middle">GitHub</text>
  <text x="65" y="160" font-family="JetBrains Mono, monospace" font-size="7px" fill="#8E8A82" text-anchor="middle">192x490 · OLED</text>
  <!-- Touch indicator -->
  <line x1="45" y1="240" x2="85" y2="240" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Corner Framing Marks -->
<line x1="38" y1="35" x2="112" y2="35" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="35" x2="38" y2="76" stroke="#4D5156" stroke-width="1"/>
<line x1="1088" y1="35" x2="1162" y2="35" stroke="#4D5156" stroke-width="1"/>
<line x1="1162" y1="35" x2="1162" y2="76" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="325" x2="112" y2="325" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="284" x2="38" y2="325" stroke="#4D5156" stroke-width="1"/>

<!-- Typography & Labels -->
<text x="58" y="77" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13px" font-weight="600" fill="#8E8A82" text-anchor="start" letter-spacing="3">QRW · XMS / 01</text>
<text x="58" y="148" font-family="Inter, Segoe UI, -apple-system, sans-serif" font-size="46px" font-weight="700" fill="#E9E5DC" text-anchor="start" letter-spacing="8">Q R W A L L E T</text>
<text x="60" y="176" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13px" font-weight="600" fill="#8E8A82" text-anchor="start" letter-spacing="2">AUTONOMOUS QUICKAPP FOR XIAOMI SMART BAND 9 &amp; 10</text>
<text x="60" y="224" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12px" font-weight="400" fill="#E9E5DC" text-anchor="start" letter-spacing="1">VELA QUICKAPP  ·  INVERTED AMOLED QR  ·  96x96 VECTORS  ·  HAPTICS</text>
<text x="60" y="252" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="400" fill="#8E8A82" text-anchor="start" letter-spacing="1">ZERO INTERNET DEPENDENCY  /  ZERO PHONE COMPANION DAEMON  /  LOCAL FLASH</text>
<text x="60" y="310" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" font-weight="600" fill="#8E8A82" text-anchor="start" letter-spacing="2">MAIOLO / SYSTEMS LAB</text>

<!-- Studio Seal & Meta -->
<text x="1115" y="308" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="700" fill="#B62B32" text-anchor="middle">食</text>
<text x="1115" y="328" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9px" font-weight="500" fill="#8E8A82" text-anchor="middle" letter-spacing="2">WEARABLE LAB</text>

<!-- Signal Dots -->
<circle cx="790" cy="63" r="2.6" fill="#38BDF8" opacity="0.9"/>
<circle cx="815" cy="63" r="2.6" fill="#B62B32" opacity="0.9"/>
<circle cx="840" cy="63" r="2.6" fill="#8E8A82" opacity="0.4"/>
</svg>
